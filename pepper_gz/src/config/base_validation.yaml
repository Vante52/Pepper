# Ensayos abiertos: se detienen al integrar la distancia/ángulo del Twist aplicado.
# Criterios de ingeniería de simulación, no especificaciones del Pepper físico.
settle_time: 0.5
repetitions: 2
criteria:
  endpoint_error_m: 0.03
  endpoint_error_fraction: 0.05
  orientation_error_rad: 0.05
  linear_velocity_rmse_mps: 0.03
  angular_velocity_rmse_rps: 0.05
  max_base_tilt_rad: 0.10
  base_height_range_m: 0.01
  max_sample_gap_s: 0.1
trials:
  - {name: forward, velocity: [0.15, 0.0, 0.0], distance: 0.4}
  - {name: backward, velocity: [-0.15, 0.0, 0.0], distance: 0.4}
  - {name: left, velocity: [0.0, 0.15, 0.0], distance: 0.4}
  - {name: right, velocity: [0.0, -0.15, 0.0], distance: 0.4}
  - {name: turn_left, velocity: [0.0, 0.0, 0.5], angle: 1.5707963267948966}
  - {name: turn_right, velocity: [0.0, 0.0, -0.5], angle: 1.5707963267948966}
  - {name: arc_left, velocity: [0.12, 0.04, 0.3], angle: 1.0}
  - {name: arc_right, velocity: [0.12, -0.04, -0.3], angle: 1.0}
